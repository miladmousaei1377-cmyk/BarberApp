name: barberbook
description: آرایش پلاس - اپلیکیشن رزرو نوبت آرایشگاه در ایران
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Local Storage
  shared_preferences: ^2.2.2

  # Shamsi Calendar
  shamsi_date: ^1.1.0

  # Animations
  animate_do: ^3.3.4
  shimmer: ^3.0.0

  # Utilities
  url_launcher: ^6.2.4
  geolocator: ^10.1.0

  # Icons
  cupertino_icons: ^1.0.6

dependency_overrides:
  # geolocator_android 4.6.x uses flutter.compileSdkVersion which is not
  # available to library sub-projects; pin to 4.5.x which uses a hardcoded value.
  geolocator_android: '>=4.5.0 <4.6.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/lottie/
    - assets/icons/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
